# Stage 1: the SSL-VAE (sidon.model.dialoguesidon2.lightning_module.SSLVAEModule).
# Frozen w2v-BERT 2.0 truncated to 8 layers, a trainable 32-dim VAE bottleneck and a DAC decoder (24 kHz), trained
# with GAN, mel, feature-matching and KL losses on clean single-speaker speech.
lightning_module:
  _target_: sidon.model.dialoguesidon2.lightning_module.SSLVAEModule
  _recursive_: false

cfg:
  vae:
    ssl_model_name: facebook/w2v-bert-2.0
    target_layer: 8
    input_dim: 1024
    hidden_dim: 512
    latent_dim: 32
    decoder_channels: 1536
    decoder_rates: [8, 5, 4, 3]
  efficient_ssl_attention: true
  performance:
    compile_ssl: true
    flex_ssl_attention: true  # FlexAttention for the frozen w2v-BERT when compiled
  kl_weight: 1.0e-5
  decoder_crop_frames: 500  # 10 s: the whole training segment
  loss_weights:
    mel: 15.0
    adv_gen: 2.0
    adv_feature: 1.0
  scheduler_gamma: 0.999996  # ExponentialLR per step, both optimizers
  mel:
    n_mels: [5, 10, 20, 40, 80, 160, 320]
    window_lengths: [32, 64, 128, 256, 512, 1024, 2048]
    mel_fmin: [0, 0, 0, 0, 0, 0, 0]
    mel_fmax: [null, null, null, null, null, null, null]
    pow: 1.0
    clamp_eps: 1.0e-5
    mag_weight: 0.0
  optim:
    fused: true
    lr: 1.0e-4
    betas: [0.8, 0.98]
    weight_decay: 0.01
